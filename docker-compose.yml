services:
  ollama:
    image: ollama/ollama:0.40.13
    networks:
      - external
      - internal
    restart: unless-stopped
    volumes:
      - ./ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    restart: unless-stopped
    read_only: true
    networks:
      - internal
    tmpfs:
      - /tmp:size=64m
    working_dir: /work
    volumes:
      - sandbox-work:/work:rw
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
      - SETGID
      - SETUID
      - CHOWN
      - NET_BIND_SERVICE
      - AUDIT_WRITE

  runtime:
    environment:
      - TASK="Напиши калькулятор на python в рабочей директории"
    build:
      context: .
      dockerfile: Dockerfile.runtime
    networks:
      - internal
      - external
    volumes:
      - ./agent.py:/app/agent.py

networks:
  external:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  sandbox-work: